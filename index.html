<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Ricettario Personale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scrivania">
        
        <!-- COPERTINA EDITORIALE -->
        <div id="libro-copertina" class="libro-copertina">
            <!-- Generata da JS -->
        </div>

        <!-- LIBRO APERTO -->
        <div id="libro-aperto" class="libro-aperto nascosto">
            
            <!-- PAGINA SINISTRA -->
            <div class="pagina pagina-sinistra">
                <div class="header-pagina-libro">
                    <span id="titolo-sinistra-header" class="capitolo-corrente">INDICE GENERALE</span>
                    <span style="font-size: 0.8rem; color: var(--testo-sfumato);">✦</span>
                </div>
                
                <div id="contenuto-pagina-sinistra" class="corpo-pagina">
                    <!-- Contenuto dinamico -->
                </div>

                <div class="footer-pagina">
                    <button id="btn-prec-sx" class="btn-classico btn-nav-footer">← Indietro</button>
                    <span id="num-pag-sx" class="numero-pagina">1</span>
                    <button id="btn-succ-sx" class="btn-classico btn-nav-footer">Avanti →</button>
                </div>
            </div>

            <!-- PAGINA DESTRA -->
            <div class="pagina pagina-destra">
                <div class="header-pagina-libro">
                    <span id="titolo-destra-header" class="capitolo-corrente">COLLEZIONE</span>
                    <span style="font-size: 0.8rem; color: var(--testo-sfumato);">✦</span>
                </div>
                
                <div id="contenuto-pagina-destra" class="corpo-pagina">
                    <!-- Contenuto dinamico -->
                </div>

                <div class="footer-pagina">
                    <div class="destra-footer-gruppo">
                        <div class="destra-footer-sinistra">
                            <button id="btn-prec-dx" class="btn-classico btn-nav-footer">← Indietro</button>
                            <button onclick="esportaBackup()" class="btn-piccolo" title="Esporta backup JSON">💾 Esporta</button>
                            <label class="btn-piccolo" style="cursor: pointer;" title="Importa backup JSON">
                                📂 Importa <input type="file" id="file-input" onchange="importaBackup(event)" style="display: none;">
                            </label>
                        </div>
                        <div class="destra-footer-destra">
                            <button id="btn-succ-dx" class="btn-classico btn-nav-footer">Avanti →</button>
                            <button id="btn-chiudi-libro" class="btn-piccolo" style="color: #b83232; font-weight: 700;">✕ Chiudi</button>
                            <span id="num-pag-dx" class="numero-pagina">2</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- MODALE AGGIUNGI / MODIFICA RICETTA -->
    <div id="modal-ricetta" class="modal-overlay hidden">
        <div class="modal-content-classico">
            <h2>Nuova Ricetta</h2>
            <form id="form-ricetta">
                <div>
                    <label for="titolo">Titolo Ricetta</label>
                    <input type="text" id="titolo" required placeholder="Es. Torta di mele">
                </div>
                <div>
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="colazioni">Colazioni & Bakery</option>
                        <option value="primi-mare">Primi di Mare</option>
                        <option value="primi-terra">Primi di Terra</option>
                        <option value="secondi-mare">Secondi di Mare</option>
                        <option value="secondi-terra">Secondi di Terra</option>
                        <option value="pizze">Pizze & Lievitati</option>
                        <option value="contorni">Contorni</option>
                        <option value="dolci">Dolci & Pasticceria</option>
                    </select>
                </div>
                <div>
                    <label for="foto">URL Immagine (facoltativo)</label>
                    <input type="url" id="foto" placeholder="https://esempio.com/foto.jpg">
                </div>
                <div>
                    <label for="persone">Porzioni Iniziali</label>
                    <input type="number" id="persone" value="4" min="1" required>
                </div>
                <div>
                    <label for="ingredienti">Ingredienti (uno per riga)</label>
                    <textarea id="ingredienti" rows="5" required placeholder="200g farina&#10;100g zucchero"></textarea>
                </div>
                <div>
                    <label for="preparazione">Preparazione (passi)</label>
                    <textarea id="preparazione" rows="5" required placeholder="1. Mescolare gli ingredienti...&#10;2. Infornare per 30 minuti..."></textarea>
                </div>
                <div>
                    <label for="note">Note dello Chef (facoltativo)</label>
                    <textarea id="note" rows="2" placeholder="Consigli o varianti..."></textarea>
                </div>
                <div class="modal-azioni">
                    <button type="button" id="btn-annulla" class="btn-piccolo">Annulla</button>
                    <button type="submit" class="btn-classico">Salva Ricetta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE STORICO PROVE -->
    <div id="modal-storico" class="modal-overlay hidden">
        <div class="modal-content-classico" style="max-width: 500px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--colore-bordo); padding-bottom: 0.8rem; margin-bottom: 1rem;">
                <div>
                    <h2 style="margin: 0; font-size: 1.3rem;">Storico Prove</h2>
                    <span id="storico-sottotitolo" style="font-size: 0.85rem; color: var(--testo-sfumato);"></span>
                </div>
                <button onclick="chiudiStoricoProve()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; font-weight: bold;">✕</button>
            </div>

            <div id="lista-prove-container" style="max-height: 350px; overflow-y: auto; padding-right: 0.3rem;">
                <!-- Dinamico -->
            </div>

            <div style="margin-top: 1.2rem; border-top: 1px solid var(--colore-bordo); padding-top: 1rem;">
                <button onclick="apriFormNuovaProva()" class="btn-classico" style="width: 100%; font-size: 0.85rem; padding: 0.6rem;">+ Segna una prova</button>
                
                <form id="form-nuova-prova-box" onsubmit="salvaNuovaProva(event)" style="display: none; margin-top: 1rem; background: #f9f9f9; padding: 1rem; border-radius: 8px; border: 1px solid var(--colore-bordo);">
                    <div style="display: flex; gap: 1rem; margin-bottom: 0.8rem;">
                        <div style="flex: 1;">
                            <label style="font-size: 0.75rem;">Data</label>
                            <input type="date" id="prova-data" required style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--colore-bordo);">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 0.75rem;">Valutazione</label>
                            <select id="prova-stelle" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--colore-bordo);">
                                <option value="5">★★★★★ (Perfetta)</option>
                                <option value="4">★★★★☆ (Ottima)</option>
                                <option value="3">★★★☆☆ (Buona)</option>
                                <option value="2">★★☆☆☆ (Da rivedere)</option>
                                <option value="1">★☆☆☆☆ (Fallita)</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-bottom: 0.8rem;">
                        <label style="font-size: 0.75rem;">Note sulla prova</label>
                        <textarea id="prova-nota" rows="2" placeholder="Cosa è andato bene o cosa modificare..." style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--colore-bordo); font-family: inherit;"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                        <button type="button" onclick="chiudiFormNuovaProva()" class="btn-piccolo" style="font-size: 0.8rem;">Annulla</button>
                        <button type="submit" class="btn-classico" style="font-size: 0.8rem; padding: 0.5rem 1rem;">Registra</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODALITÀ CUCINA FULLSCREEN -->
    <div id="modal-chef" class="modal-overlay-chef hidden">
        <div id="chef-sfondo-container"></div>
        <div class="chef-overlay-scuro"></div>
        
        <div class="chef-fullscreen-container">
            <div class="chef-fs-header">
                <div id="chef-fs-titolo-ricetta" class="chef-fs-titolo-ricetta">RICETTA</div>
                <div id="chef-fs-timer-container"></div>
                <button class="chef-fs-chiudi" onclick="chiudiModalChef()">✕</button>
            </div>

            <div class="chef-fs-barra-container" id="chef-fs-barre"></div>

            <div class="chef-fs-corpo">
                <div id="chef-fs-step-indicatore" class="chef-fs-step-indicatore">PASSAGGIO 1</div>
                <div id="chef-fs-testo" class="chef-fs-testo">Caricamento...</div>
            </div>

            <div class="chef-fs-footer">
                <button class="chef-fs-btn-nav" id="chef-fs-btn-prec" onclick="passoPrecedente()">← Indietro</button>
                <button class="chef-fs-btn-nav primario" id="chef-fs-btn-succ" onclick="passoSuccessivo()">Avanti →</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
